definitions:
  # the names of the functions - we use this to generate the code and to register the functions in
  # the javascript class
  ifunction: "js_${generator.prefix}_${class_name}_${func_name}"
  sfunction: "js_${generator.prefix}_${class_name}_${func_name}"
  constructor: "js_${generator.prefix}_${class_name}_constructor"
conversions:
  # some times you want to use a special native type when converting from v8 to native
  # the most common case would be from JS-number to bool. Using "bool" will fail here since we
  # pass the address to the conversion method, and numbers in JS are always doubles
  native_types:
    "unsigned char": "uint16_t"
    "char": "int32_t"
  ns_map:
    "ax::experimental::ui::": "axexp."
    "ax::experimental::": "axexp."
    "ax::extension::": "ax."
    "ax::ui::": "axui."
    "ax::": "ax."
    "spine::": "sp."
    "cocostudio::timeline::": "ccs."
    "cocostudio::": "ccs."
    "ax::tweenfunc::": "ax."
    "ax::backend::": "axb."
    "tsl::": "tsl."
    "hlookup::": "hlookup."
    "fairygui::": "fgui."

  to_native:
    # v8 to native using v8pp conversions
    int: "${out_value} = v8pp::from_v8<int>(isolate, ${in_value})"
    "unsigned int": "${out_value} = v8pp::from_v8<unsigned int>(isolate, ${in_value})"
    "unsigned char": "${out_value} = v8pp::from_v8<unsigned char>(isolate, ${in_value})"
    short: "${out_value} = v8pp::from_v8<short>(isolate, ${in_value})"
    "unsigned short": "${out_value} = v8pp::from_v8<unsigned short>(isolate, ${in_value})"
    char: "${out_value} = v8pp::from_v8<char>(isolate, ${in_value})"
    bool: "${out_value} = v8pp::from_v8<bool>(isolate, ${in_value})"
    float: "${out_value} = v8pp::from_v8<float>(isolate, ${in_value})"
    double: "${out_value} = v8pp::from_v8<double>(isolate, ${in_value})"
    ssize_t: "${out_value} = v8pp::from_v8<ssize_t>(isolate, ${in_value})"
    "long long": "${out_value} = v8pp::from_v8<long long>(isolate, ${in_value})"
    "unsigned long long": "${out_value} = v8pp::from_v8<unsigned long long>(isolate, ${in_value})"
    "string": "${out_value} = v8pp::from_v8<std::string>(isolate, ${in_value})"
    "string_view": "${out_value} = v8pp::from_v8<std::string_view>(isolate, ${in_value})"
    "String*": "std::string ${out_value}_tmp = v8pp::from_v8<std::string>(isolate, ${in_value}); ${out_value} = ax::String::create(${out_value}_tmp)"
    "char*": "std::string ${out_value}_tmp = v8pp::from_v8<std::string>(isolate, ${in_value}); ${out_value} = ${out_value}_tmp.c_str()"
    "Point": "${out_value} = v8pp::from_v8<ax::Vec2>(isolate, ${in_value})"
    "Vec2": "${out_value} = v8pp::from_v8<ax::Vec2>(isolate, ${in_value})"
    "Vec3": "${out_value} = v8pp::from_v8<ax::Vec3>(isolate, ${in_value})"
    "Vec4": "${out_value} = v8pp::from_v8<ax::Vec4>(isolate, ${in_value})"
    "Rect": "${out_value} = v8pp::from_v8<ax::Rect>(isolate, ${in_value})"
    "Size": "${out_value} = v8pp::from_v8<ax::Size>(isolate, ${in_value})"
    "Color4B": "${out_value} = v8pp::from_v8<ax::Color4B>(isolate, ${in_value})"
    "Color4F": "${out_value} = v8pp::from_v8<ax::Color4F>(isolate, ${in_value})"
    "Color3B": "${out_value} = v8pp::from_v8<ax::Color3B>(isolate, ${in_value})"
    "Value": "${out_value} = v8pp::from_v8<ax::Value>(isolate, ${in_value})"
    "ValueMap": "${out_value} = v8pp::from_v8<ax::ValueMap>(isolate, ${in_value})"
    "ValueMapIntKey": "${out_value} = v8pp::from_v8<ax::ValueMapIntKey>(isolate, ${in_value})"
    "ValueVector": "${out_value} = v8pp::from_v8<ax::ValueVector>(isolate, ${in_value})"
    "@vector<std::string>": "${out_value} = v8pp::from_v8<std::vector<std::string>>(isolate, ${in_value})"
    "@vector<int.*>": "${out_value} = v8pp::from_v8<std::vector<int>>(isolate, ${in_value})"
    "@vector<float.*>": "${out_value} = v8pp::from_v8<std::vector<float>>(isolate, ${in_value})"
    "@vector<unsigned short.*>": "${out_value} = v8pp::from_v8<std::vector<unsigned short>>(isolate, ${in_value})"
    "@Map<std::string,.*>": "${out_value} = v8pp::from_v8<std::map<std::string, ${1}>>(isolate, ${in_value})"
    "@std::map<std::string.*,\\s*std::string.*>": "${out_value} = v8pp::from_v8<std::map<std::string, std::string>>(isolate, ${in_value})"
    "Data": "throw std::runtime_error(\"ax::Data unsupported in JS bindings\")"

    object: "${out_value} = v8pp::from_v8<${arg.to_string($generator).replace(\"*\", \"\")}*>(isolate, ${in_value})"
  from_native:
    # native to v8 using v8pp conversions
    int: "v8pp::to_v8(isolate, ${in_value})"
    "unsigned int": "v8pp::to_v8(isolate, ${in_value})"
    "unsigned short": "v8pp::to_v8(isolate, ${in_value})"
    "unsigned char": "v8pp::to_v8(isolate, ${in_value})"
    short: "v8pp::to_v8(isolate, ${in_value})"
    char: "v8pp::to_v8(isolate, ${in_value})"
    "long long": "v8pp::to_v8(isolate, ${in_value})"
    "unsigned long long": "v8pp::to_v8(isolate, ${in_value})"
    "string": "v8pp::to_v8(isolate, ${in_value})"
    "string_view": "v8pp::to_v8(isolate, std::string(${in_value}))"
    "__thread_id": "v8pp::to_v8(isolate, std::to_string(${in_value}))"
    "char*": "v8pp::to_v8(isolate, std::string(${in_value} ? ${in_value} : \"\"))"
    "String*": "v8pp::to_v8(isolate, ${in_value} ? ${in_value}->getCString() : \"\")"
    bool: "v8pp::to_v8(isolate, ${in_value})"
    float: "v8pp::to_v8(isolate, ${in_value})"
    double: "v8pp::to_v8(isolate, ${in_value})"
    long: "v8pp::to_v8(isolate, ${in_value})"
    ssize_t: "v8pp::to_v8(isolate, ${in_value})"
    "unsigned long": "v8pp::to_v8(isolate, ${in_value})"
    "Point": "v8pp::to_v8(isolate, ${in_value})"
    "Vec2": "v8pp::to_v8(isolate, ${in_value})"
    "Vec3": "v8pp::to_v8(isolate, ${in_value})"
    "Vec4": "v8pp::to_v8(isolate, ${in_value})"
    "Rect": "v8pp::to_v8(isolate, ${in_value})"
    "Size": "v8pp::to_v8(isolate, ${in_value})"
    "Color4B": "v8pp::to_v8(isolate, ${in_value})"
    "Color4F": "v8pp::to_v8(isolate, ${in_value})"
    "Color3B": "v8pp::to_v8(isolate, ${in_value})"
    "Value": "v8pp::to_v8(isolate, ${in_value})"
    "ValueMap": "v8pp::to_v8(isolate, ${in_value})"
    "ValueMapIntKey": "v8pp::to_v8(isolate, ${in_value})"
    "ValueVector": "v8pp::to_v8(isolate, ${in_value})"
    "@vector<std::string>": "v8pp::to_v8(isolate, ${in_value})"
    "@vector<int.*>": "v8pp::to_v8(isolate, ${in_value})"
    "@vector<float.*>": "v8pp::to_v8(isolate, ${in_value})"
    "@vector<unsigned short.*>": "v8pp::to_v8(isolate, ${in_value})"
    "@Map<std::string.*>": "v8pp::to_v8(isolate, ${in_value})"
    "@std::map<std::string.*,\\s*std::string.*>": "v8pp::to_v8(isolate, ${in_value})"

    object: "v8pp::to_v8(isolate, ${in_value})"

